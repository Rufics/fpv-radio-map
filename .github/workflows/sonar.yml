# SonarQube Cloud analysis with coverage, for pull requests from branches of this repository and
# every push to main. The settings are in sonar-project.properties; the one-time setup (automatic
# analysis off, the SONAR_TOKEN secret) is in docs/dev/sonarcloud.md.
#
# The analysis needs the SONAR_TOKEN secret, which pull requests from forks and Dependabot never
# get, so their runs skip it; ci.yml still tests them. The token is passed to the scanner step
# only, never to the steps that build and run the pull request's code. Without the secret the
# analysis is skipped instead of failing, so the workflow is harmless until the setup is done.
#
# A pull request builds, tests and scans only what it changes (tools/ci/sonar_scope.py): a
# web-only change skips the C++ build and the Python tests, and the scanner reads only the changed
# files. Pushes to main and manual runs analyse everything. The job always runs to the scan, so
# its check and the SonarQube Cloud quality gate report on every analysed pull request.
name: SonarQube Cloud

on:
  pull_request:
    paths-ignore:
      - docs/**
      - "**.md"
      - LICENSE
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  token:
    name: SonarQube Cloud token
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN is not set: the SonarQube Cloud analysis is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  analysis:
    name: SonarQube Cloud analysis
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      # Full history, so new code and blame information are right.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # 1. Scope: which parts this run builds and which files it scans. Rewrites
      #    sonar-project.properties in this checkout with the scope appended.
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -I tools/ci/sonar_scope.py --settings sonar-project.properties
          --output sonar-project.properties --base "$BASE" --head "$HEAD"

      # 2. Coverage of each part in scope, one composite action per part.
      - name: C++ coverage
        if: steps.scope.outputs.cpp == 'true'
        uses: ./.github/actions/sonar-cpp
      - name: Python coverage
        if: steps.scope.outputs.python == 'true'
        uses: ./.github/actions/sonar-python
      - name: Web coverage
        if: steps.scope.outputs.web == 'true'
        uses: ./.github/actions/sonar-web

      # 3. Scan: the only step that gets the token.
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
