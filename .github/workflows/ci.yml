# Tests every pull request. main.yml (every push to main) and release.yml (the release button)
# call this same workflow, so they run exactly these checks. On a pull request only the parts its
# files can affect are built: a change to docs alone builds nothing. Skipped jobs still report, so
# the required checks pass without running.
#
# This workflow runs the pull request's own code with a read-only token and no secrets. Only the
# comment job may write, and it runs no code from the pull request: it posts the finished report
# as text, and only on a pull request from a branch of this repository. A fork's pull request
# gets its comment from ci-report.yml, which reads the artifacts of this run as data with the
# code of main.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-24.04
    outputs:
      cpp: ${{ steps.scope.outputs.cpp }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      # A file outside the known lists builds everything, so a new folder is never left untested.
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cpp=false; web=false
          for f in $(git diff --name-only "$BASE...$HEAD"); do
            case "$f" in
              docs/*|*.md|LICENSE|.github/ISSUE_TEMPLATE/*|.github/DISCUSSION_TEMPLATE/*|.github/dependabot.yml) ;;
              .github/workflows/pr-title.yml|.github/workflows/wiki.yml|tools/wiki/*|.githooks/*) ;;
              .github/workflows/ci-report.yml|.github/CODEOWNERS|.github/pull_request_template.md) ;;
              .github/workflows/main.yml|.github/workflows/release.yml|deploy/*|tools/tiles-builder/*|tools/ci/*) ;;
              .dockerignore|.gitignore) ;;
              web/*) web=true ;;
              schemas/*|.github/workflows/ci.yml) cpp=true; web=true ;;
              core/*|platform/*|modules/*|server/*|examples/*|data/*|CMakeLists.txt|.github/actions/cpp-deps/*) cpp=true ;;
              *) echo "No rule for $f: building everything."; cpp=true; web=true ;;
            esac
          done
          echo "C++: $cpp, web: $web"
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  cpp:
    name: C++ build and tests
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cpp-deps
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRFMAP_BUILD_TESTS=ON -DRFMAP_BUILD_SERVER=ON
      - name: Build
        run: cmake --build build
      # Includes the server integration test against a throw-away PostgreSQL 16 + PostGIS
      # cluster (server/tests/pg_fixture.sh) and the signed-package upload checks.
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit "$GITHUB_WORKSPACE/test-results/cpp.xml"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-cpp
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The same tests on an instrumented build (-O0 --coverage), so the Release job above stays the
  # gate for the binaries that ship. Like every job here it tests the merge commit; the report
  # links the uncovered lines to that commit, so the line numbers match.
  coverage:
    name: C++ coverage
    needs: changes
    if: needs.changes.outputs.cpp == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      html-url: ${{ steps.html.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/cpp-deps
        with:
          extra: gcovr
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRFMAP_BUILD_TESTS=ON -DRFMAP_BUILD_SERVER=ON -DRFMAP_COVERAGE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Product code only: tests, the example module, fetched dependencies and generated files
      # are not counted. The sandboxed module worker is skipped too: it leaves through _exit()
      # under seccomp, so its counters are never written completely.
      - name: Collect coverage
        if: success() || failure()
        run: |
          mkdir -p coverage/html
          gcovr --root . -j "$(nproc)" \
            --exclude-directories '.*/_deps$' --exclude-directories '.*/rfmod-worker\.dir$' \
            --filter 'core/' --filter 'platform/' --filter 'modules/' --filter 'server/' \
            --exclude '.*/tests/.*' \
            --json coverage/coverage.json \
            --html-details coverage/html/index.html --html-title 'fpv-radio-map C++ coverage' \
            --print-summary \
            build
      # Lines this pull request adds or changes: the merge commit against its first parent, the
      # base branch it was merged onto.
      - name: List the changed lines
        if: success() || failure()
        run: |
          git diff --unified=0 --no-color --no-ext-diff --no-renames HEAD^1 HEAD > coverage/changes.diff
          git rev-parse HEAD > coverage/commit.txt
      - if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cpp
          path: |
            coverage/coverage.json
            coverage/changes.diff
            coverage/commit.txt
          if-no-files-found: ignore
          retention-days: 7
      - id: html
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cpp-html
          path: coverage/html/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web build and tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Build (mock backend)
        run: npm run build:mock
      - name: Test ui-kit
        run: npm run ng -- test ui-kit --watch=false --reporters=default --reporters=junit --output-file="$GITHUB_WORKSPACE/test-results/web-ui-kit.xml"
      - name: Test fpv-app
        if: success() || failure()
        run: npm run ng -- test fpv-app --watch=false --reporters=default --reporters=junit --output-file="$GITHUB_WORKSPACE/test-results/web-fpv-app.xml"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-web
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The gate: the one required check, red when any job above failed. Also writes the report to
  # the run summary and hands it to the comment job below.
  report:
    name: Test report
    if: always()
    needs: [changes, cpp, coverage, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Test the report builder
        run: python3 -I -m unittest discover -s tools/ci -p '*_test.py'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/ci-data/tests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.coverage.result != 'skipped'
        continue-on-error: true
        with:
          name: coverage-cpp
          path: ${{ runner.temp }}/ci-data/coverage
      # report.py reads fixed file names under the current directory only.
      - name: Write the report
        env:
          REPORT_JOBS: ${{ toJSON(needs) }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_COVERAGE_URL: ${{ needs.coverage.outputs.html-url }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-data"
          cd "$RUNNER_TEMP/ci-data"
          python3 -I "$GITHUB_WORKSPACE/tools/ci/report.py" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report
          path: ${{ runner.temp }}/ci-data/report.md
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail when a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # One comment per pull request, updated on every run. The only job with write access, and it
  # checks out and runs no code: it reads the finished report as text and posts it with the gh
  # CLI. Only for branches of this repository: forks and runs started by Dependabot get a
  # read-only token, and ci-report.yml, which checks the same actor, comments for them. A run
  # cancelled by a newer push leaves the comment to that push's run. Not a required check, so a
  # failed comment never blocks a merge.
  comment:
    name: Post the CI report
    needs: report
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-report
          path: ${{ runner.temp }}/ci-report
      - name: Post the report to the pull request
        working-directory: ${{ runner.temp }}/ci-report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: <!-- rfmap-ci-report -->
        run: |
          if [ "$(head -n 1 report.md)" != "$MARKER" ] || [ "$(wc -c < report.md)" -gt 65000 ]; then
            echo "::error::report.md is not a CI report"
            exit 1
          fi
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          id="$(gh api --paginate "$comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' | tail -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh api --method POST "$comments" -F body=@report.md > /dev/null
          fi
