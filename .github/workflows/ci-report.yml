# Posts the CI report to the pull request, for pull requests from branches and from forks alike.
#
# ci.yml runs the pull request's own code, so it gets a read-only token and cannot comment on a
# fork's pull request. This workflow runs after it, from main, with the code of main only: it never
# checks out or runs anything from the pull request. It reads the artifacts of that run as data
# (test results, coverage, changed lines), builds the report with tools/ci/report.mjs from main,
# and keeps one comment per pull request up to date.
#
# GitHub runs workflow_run workflows from the default branch only, so a change to this file takes
# effect once it is merged, and a pull request cannot change what it does.
name: CI report

on:
  # The safe use of workflow_run: no pull request code is checked out or run, artifacts are read
  # as size-capped data outside the workspace, and the pull request is found from the run's head.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: ci-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post the CI report
    # Runs of CI called by main.yml or release.yml are not pull requests. A cancelled run was
    # replaced by a newer push, whose own run reports.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # main's report builder, not the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci

      # The pull request is looked up from the run's head commit, never from an artifact: the
      # contents of the artifacts are written by the pull request's code.
      - name: Find the pull request and the run's jobs
        id: run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOBS_FILE: ${{ runner.temp }}/jobs.json
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const head = run.head_repository;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${head.owner.login}:${run.head_branch}`, per_page: 100,
            });
            const pr = prs.find((p) => p.head.sha === run.head_sha && p.head.repo?.full_name === head.full_name);
            if (!pr) {
              core.notice(`No open pull request has ${run.head_sha} as its head any more; nothing to report.`);
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            fs.writeFileSync(process.env.JOBS_FILE, JSON.stringify(
              jobs.map((j) => ({ name: j.name, result: j.conclusion ?? j.status, url: j.html_url })),
            ));
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const html = artifacts.find((a) => a.name === 'coverage-cpp-html' && !a.expired);
            core.setOutput('number', String(pr.number));
            core.setOutput('coverage', String(artifacts.some((a) => a.name === 'coverage-cpp' && !a.expired)));
            core.setOutput('coverage_url', html ? `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}/artifacts/${html.id}` : '');

      # Untrusted data goes to a folder of its own outside the workspace, so it cannot replace
      # the checked-out scripts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.run.outputs.number != ''
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: test-results-*
          path: ${{ runner.temp }}/untrusted/tests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.run.outputs.number != '' && steps.run.outputs.coverage == 'true'
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: coverage-cpp
          path: ${{ runner.temp }}/untrusted/coverage

      - name: Write the report
        if: steps.run.outputs.number != ''
        env:
          DATA: ${{ runner.temp }}/untrusted
          JOBS_FILE: ${{ runner.temp }}/jobs.json
          REPORT_FILE: ${{ runner.temp }}/report.md
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COVERAGE_URL: ${{ steps.run.outputs.coverage_url }}
        run: |
          node tools/ci/report.mjs --jobs-file "$JOBS_FILE" --results "$DATA/tests" \
            --coverage "$DATA/coverage/coverage.json" --diff "$DATA/coverage/changes.diff" \
            --commit-file "$DATA/coverage/commit.txt" \
            --sha "$HEAD_SHA" --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --coverage-url "$COVERAGE_URL" > "$REPORT_FILE"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated on every run.
      - name: Post the report to the pull request
        if: steps.run.outputs.number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.run.outputs.number }}
          REPORT_FILE: ${{ runner.temp }}/report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rfmap-ci-report -->';
            const limit = 65000;
            let body = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            if (!body.startsWith(marker)) throw new Error('The report does not start with its marker.');
            if (body.length > limit) body = `${body.slice(0, limit)}\n\n… (cut; the full report is in the run summary)\n`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
