# Posts the CI report to pull requests from forks. ci.yml comments itself on pull requests from
# branches of this repository.
#
# ci.yml runs the pull request's own code, and a fork's run gets a read-only token, so it cannot
# comment. This workflow runs after it, from main, with the code of main only: it never
# checks out or runs anything from the pull request. It reads the artifacts of that run as data
# (test results, coverage, changed lines), builds the report with tools/ci/report.py from main,
# and keeps one comment per pull request up to date (tools/ci/pr_comment.py).
#
# GitHub runs workflow_run workflows from the default branch only, so a change to this file takes
# effect once it is merged, and a pull request cannot change what it does.
name: CI report

on:
  # The safe use of workflow_run: no pull request code is checked out or run, artifacts are read
  # as size-capped data outside the workspace, and the pull request is found from the run's head.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: ci-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post the CI report
    # Runs of CI called by main.yml or release.yml are not pull requests. A cancelled run was
    # replaced by a newer push, whose own run reports. Branches of this repository got their
    # comment from ci.yml already.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # main's report builder, not the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci

      - name: Prepare the data folder
        run: mkdir -p "$RUNNER_TEMP/ci-data"

      # The pull request is looked up from the run's head commit, never from an artifact: the
      # contents of the artifacts are written by the pull request's code.
      - name: Find the pull request and the run's jobs
        id: run
        working-directory: ${{ runner.temp }}/ci-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: python3 -I "$GITHUB_WORKSPACE/tools/ci/pr_comment.py" find >> "$GITHUB_OUTPUT"

      # Untrusted data goes to a folder of its own outside the workspace, so it cannot replace
      # the checked-out scripts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.run.outputs.number != ''
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: test-results-*
          path: ${{ runner.temp }}/ci-data/tests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.run.outputs.number != '' && steps.run.outputs.coverage == 'true'
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: coverage-cpp
          path: ${{ runner.temp }}/ci-data/coverage

      - name: Write the report
        if: steps.run.outputs.number != ''
        working-directory: ${{ runner.temp }}/ci-data
        env:
          REPORT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPORT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPORT_COVERAGE_URL: ${{ steps.run.outputs.coverage_url }}
        run: |
          python3 -I "$GITHUB_WORKSPACE/tools/ci/report.py" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated on every run.
      - name: Post the report to the pull request
        if: steps.run.outputs.number != ''
        working-directory: ${{ runner.temp }}/ci-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.run.outputs.number }}
        run: python3 -I "$GITHUB_WORKSPACE/tools/ci/pr_comment.py" post
