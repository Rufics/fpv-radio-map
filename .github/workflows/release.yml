# The release button: Actions → Release → Run workflow (on main).
# semantic-release reads the Conventional Commits since the last tag and decides the next version
# (fix → patch, feat → minor, ! or BREAKING CHANGE → major). The workflow then runs the full CI,
# builds and signs the FPV modules with the owner key, creates the tag and the GitHub release with
# generated notes and the signed packages, and publishes the Docker images with that version.
#
# Needs, in Settings → Secrets and variables → Actions:
#   variable RFMAP_OWNER_PUBKEY      contents of owner.pub   (rfmod keygen --out owner)
#   secret   RFMAP_OWNER_SECRET_KEY  contents of owner.secret
# A release never falls back to the public development key.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show which version would be released and its notes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Next version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run is on $GITHUB_REF)."
          exit 1
      - name: Owner key is configured
        if: inputs.dry_run == false
        env:
          PUB: ${{ vars.RFMAP_OWNER_PUBKEY }}
          SECRET_SET: ${{ secrets.RFMAP_OWNER_SECRET_KEY != '' }}
        run: |
          case "$PUB" in rfmod-ed25519-pub:*) ;; *) echo "::error::Set the repository variable RFMAP_OWNER_PUBKEY to the contents of owner.pub."; exit 1;; esac
          [ "$SECRET_SET" = true ] || { echo "::error::Set the repository secret RFMAP_OWNER_SECRET_KEY to the contents of owner.secret."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Baseline tag v0.1.0 when the repository has no release yet
        # Without any tag semantic-release would start at 1.0.0, and the FPV modules accept hosts
        # <1.0.0 only. The first release therefore counts from v0.1.0 on the first commit.
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            git tag v0.1.0 "$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "BASELINE_CREATED=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/ci
      - id: version
        name: Ask semantic-release for the next version
        working-directory: tools/ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION_FILE: ${{ runner.temp }}/next-version
        run: |
          npx semantic-release --dry-run --no-ci --branches main | tee "$RUNNER_TEMP/plan.log"
          if [ -s "$RELEASE_VERSION_FILE" ]; then
            v=$(cat "$RELEASE_VERSION_FILE")
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "### Next release: v$v" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: no feat, fix or breaking change since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: plan
    if: needs.plan.outputs.version != '' && inputs.dry_run == false
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  release:
    name: Build, sign and release v${{ needs.plan.outputs.version }}
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgeographiclib-dev nlohmann-json3-dev libarchive-dev libsodium-dev \
            libpqxx-dev libgdal-dev libcpp-httplib-dev libgtest-dev
      - name: Build v${{ env.VERSION }} with the owner key
        env:
          PUB: ${{ vars.RFMAP_OWNER_PUBKEY }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRFMAP_BUILD_TESTS=OFF -DRFMAP_BUILD_SERVER=OFF \
            -DRFMAP_VERSION="$VERSION" -DRFMAP_OWNER_PUBKEY="$PUB"
          cmake --build build
      - name: Sign the FPV modules and run their upload checks
        env:
          PUB: ${{ vars.RFMAP_OWNER_PUBKEY }}
          SECRET: ${{ secrets.RFMAP_OWNER_SECRET_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SECRET" > "$RUNNER_TEMP/owner.secret"
          printf '%s\n' "$PUB" > "$RUNNER_TEMP/owner.pub"
          tools/ci/pack-modules.sh build "$RUNNER_TEMP/owner.secret" "$RUNNER_TEMP/owner.pub" dist/release
          rm -f "$RUNNER_TEMP/owner.secret"
          install -m 0755 build/platform/rfmod/rfmod dist/release/rfmod-linux-x86_64
          ls -l dist/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/ci
      - name: Baseline tag v0.1.0 when the repository has no release yet
        # Without any tag semantic-release would start at 1.0.0, and the FPV modules accept hosts
        # <1.0.0 only. The first release therefore counts from v0.1.0 on the first commit.
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            git tag v0.1.0 "$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "BASELINE_CREATED=1" >> "$GITHUB_ENV"
          fi
      - name: Push the baseline tag
        if: env.BASELINE_CREATED == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/v0.1.0
      - name: Tag and publish the GitHub release
        working-directory: tools/ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION_FILE: ${{ runner.temp }}/released-version
        run: |
          npx semantic-release --no-ci --branches main
          released=$(cat "$RELEASE_VERSION_FILE" 2>/dev/null || true)
          if [ "$released" != "$VERSION" ]; then
            echo "::error::semantic-release released '$released', expected '$VERSION' (did main move during the run?)"
            exit 1
          fi

  images:
    name: Publish images v${{ needs.plan.outputs.version }}
    needs: [plan, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/fpv-radio-map-server
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/fpv-radio-map-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.plan.outputs.version }}
          persist-credentials: false
      - name: Image names and tags
        run: |
          echo "SERVER_IMAGE=${SERVER_IMAGE,,}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${WEB_IMAGE,,}" >> "$GITHUB_ENV"
          echo "MINOR=${VERSION%.*}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          build-args: |
            RFMAP_OWNER_PUBKEY=${{ vars.RFMAP_OWNER_PUBKEY }}
            RFMAP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ env.VERSION }}
            ${{ env.SERVER_IMAGE }}:${{ env.MINOR }}
            ${{ env.SERVER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server
      - name: Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.VERSION }}
            ${{ env.WEB_IMAGE }}:${{ env.MINOR }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
