# Every push to main: the full CI, then the Docker images are built, started together with
# PostGIS and checked end to end, and published to GHCR as :edge and :sha-<commit>.
name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  images:
    name: Docker images and smoke test
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/fpv-radio-map-server
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/fpv-radio-map-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Lower-case image names
        run: |
          echo "SERVER_IMAGE=${SERVER_IMAGE,,}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${WEB_IMAGE,,}" >> "$GITHUB_ENV"
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/server.Dockerfile
          load: true
          tags: ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}
          # Empty variable = the public development key; the image logs a warning about it.
          build-args: |
            RFMAP_OWNER_PUBKEY=${{ vars.RFMAP_OWNER_PUBKEY }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/web.Dockerfile
          load: true
          tags: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test (PostGIS + server + web)
        env:
          RFMAP_SERVER_IMAGE: ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}
          RFMAP_WEB_IMAGE: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
        run: deploy/ci/smoke.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish :edge and :sha-<commit>
        run: |
          for img in "$SERVER_IMAGE" "$WEB_IMAGE"; do
            docker tag "$img:sha-$GITHUB_SHA" "$img:edge"
            docker push "$img:sha-$GITHUB_SHA"
            docker push "$img:edge"
          done
          {
            echo "### Published images"
            echo "- \`$SERVER_IMAGE:edge\` (\`sha-$GITHUB_SHA\`)"
            echo "- \`$WEB_IMAGE:edge\` (\`sha-$GITHUB_SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"
