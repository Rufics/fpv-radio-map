# Looks for code copied from other open source projects: every file and snippet is fingerprinted
# and matched against the SCANOSS open source knowledge base (osskb.org, free for open source).
# Only fingerprints leave the runner, never the source. Dependency licences and licence headers
# are not checked here. Pull requests scan the files they change; the weekly run scans everything.
# A match marks the "Policy Check: Undeclared" or "Policy Check: Copyleft" run as action required;
# this job stays green. Matches against this repository itself, and accepted ones, are listed in
# scanoss.json.
name: Code origin

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: code-origin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Copied code scan
    # A fork's pull request gets a read-only token, so the action cannot create its check runs or
    # comment. Fork changes are scanned by the weekly run once they are on main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # undeclared: any match not accepted in scanoss.json; copyleft: a match under a copyleft licence.
      - uses: scanoss/gha-code-scan@d3c8f659544885761c8e3b96743ea14b830474aa # v1.7.0
        with:
          scanMode: ${{ github.event_name == 'pull_request' && 'delta' || 'full' }}
          dependencies.enabled: false
          policies: undeclared, copyleft
