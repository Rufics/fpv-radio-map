# Dependency updates. Policy:
#   * Dependabot opens minor and patch updates only. Major updates are done by hand when a
#     maintainer decides to move (they usually need code changes), so they are ignored here.
#   * Base images follow long-term-support lines only: Ubuntu LTS (YY.04 of even years), Node.js
#     LTS (even majors) and nginx stable (even minors). Moving to a new LTS line is a major step
#     for Ubuntu and Node.js, but it is the one major bump Dependabot is allowed to propose.
#   * A cooldown keeps freshly published releases out for a few days, so a broken or hijacked
#     release is usually yanked before it reaches a pull request.
#   * Updates are grouped to keep the number of pull requests low.
# Security updates are opened by Dependabot as soon as an advisory is published; they are not
# delayed by the schedule or the cooldown.
#
# Titles follow Conventional Commits with the "deps" scope ("build(deps): ..."), so they pass the
# PR title check and don't trigger a release on their own. The prefix carries the scope itself:
# "include: scope" would write "deps-dev" for development dependencies, which commitlint rejects.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Kyiv }
    commit-message: { prefix: build(deps) }
    cooldown: { default-days: 5 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Kyiv }
    commit-message: { prefix: build(deps) }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      # Angular packages and the TypeScript version they support move together.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "ng-packagr", "typescript"]
        update-types: [minor, patch]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/ci
    schedule: { interval: monthly, time: "06:00", timezone: Europe/Kyiv }
    commit-message: { prefix: build(deps) }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      release-tooling:
        patterns: ["*"]
        update-types: [minor, patch]

  # Image tags and digests in the Dockerfiles. There is no "*" major rule here: it would also
  # block the move to the next Ubuntu or Node.js LTS. Each image instead ignores its non-LTS lines.
  - package-ecosystem: docker
    directories: [/deploy, /tools/tiles-builder]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Kyiv }
    commit-message: { prefix: build(deps) }
    cooldown: { default-days: 5 }
    ignore:
      # Interim releases (YY.10, and YY.04 of odd years) get 9 months of support.
      - dependency-name: ubuntu
        versions: [">= 24.10, < 26.04", ">= 26.10, < 28.04", ">= 28.10, < 30.04"]
      # Odd majors never become LTS.
      - dependency-name: node
        versions: [">= 25, < 26", ">= 27, < 28", ">= 29, < 30", ">= 31, < 32"]
      # Odd minors are the mainline branch; even minors are stable.
      - dependency-name: nginx
        versions: [">= 1.29, < 1.30", ">= 1.31, < 1.32", ">= 1.33, < 1.34"]
      - dependency-name: nginx
        update-types: [version-update:semver-major]

  # Images of the services in the compose file (PostGIS, Open-Meteo).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Kyiv }
    commit-message: { prefix: build(deps) }
    cooldown: { default-days: 5 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
