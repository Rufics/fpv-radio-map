# The perf stand: PostGIS and rfmap-server with the perf configuration, and k6 to load it.
# perf.py starts it before a scenario and removes it after, with its database, so every run
# starts from the same state (README.md, "HTTP scenarios"). To look at it by hand:
#   RFMAP_PERF_DATA=<dataset>/out RFMAP_PERF_ADMIN_TOKEN=<token> RFMAP_PERF_RUN_DIR=/tmp/run \
#     docker compose -f tools/perf/stand/compose.yml up -d
#
# CPU and memory limits make runs on different machines comparable; they are recorded with
# every run. Images are pinned by digest, read from the registries on 2026-10-21.
#
# Profiles: `load` is k6, `monitoring` is Prometheus with cAdvisor and postgres_exporter (on
# unless --no-monitoring), `grafana` is Grafana on the same Prometheus (only with --keep-stand,
# since it is for looking at the stand by hand).
#
# Each container runs in a cgroup parent of its own (rfmapperf_<service>.slice), so cAdvisor
# reports it by that fixed name: its Docker integration cannot see containers on the containerd
# image store (the default since Docker 29), its raw cgroup view always can. No dash in the
# names, since systemd would read one as a level of slices.

name: rfmap-perf

services:
  postgis:
    image: postgis/postgis:18-3.6@sha256:b4466ea2ba7e3af54fcbba996d45325720f4b3ecb4f43f99b2f41367dc196f23
    environment:
      POSTGRES_DB: rfmap
      POSTGRES_USER: rfmap
      # The stand's database is reachable only from its own network and lives for one run.
      POSTGRES_PASSWORD: perf
    cgroup_parent: rfmapperf_postgis.slice
    cpus: ${RFMAP_PERF_DB_CPUS:-2}
    mem_limit: ${RFMAP_PERF_DB_MEMORY:-2g}
    healthcheck:
      # Over TCP: while the image initialises the database, its temporary server listens on the
      # socket only, and a socket check would let rfmap-server start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rfmap -d rfmap"]
      interval: 2s
      timeout: 5s
      retries: 30

  rfmap-server:
    build:
      context: ../../..
      dockerfile: deploy/server.Dockerfile
    image: ${RFMAP_PERF_SERVER_IMAGE:-rfmap-server:perf}
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      RFMAP_DATABASE_URL: postgresql://rfmap:perf@postgis:5432/rfmap
      RFMAP_ADMIN_TOKEN: ${RFMAP_PERF_ADMIN_TOKEN:?perf.py sets the admin token}
    volumes:
      - ./server.perf.json:/etc/rfmap/rfmap.json:ro
      - ${RFMAP_PERF_DATA:?perf.py passes the dataset folder}:/data:ro
    ports:
      - "127.0.0.1:${RFMAP_PERF_PORT:-18080}:8080"
    cgroup_parent: rfmapperf_server.slice
    cpus: ${RFMAP_PERF_SERVER_CPUS:-4}
    mem_limit: ${RFMAP_PERF_SERVER_MEMORY:-4g}

  # Started by perf.py with `run`, once the server is ready and the set-up is done.
  k6:
    image: grafana/k6:1.0.0@sha256:f21270290d702cbf0a7d6ba5d7ed100b63bcb233b558b885ed787547b3488279
    profiles: [load]
    depends_on: [rfmap-server]
    # The caller's user, so k6 can write its summary into the run folder.
    user: ${RFMAP_PERF_USER:-12345:12345}
    volumes:
      - ../k6:/scripts:ro
      - ${RFMAP_PERF_RUN_DIR:?perf.py passes the run folder}:/run/perf
    cgroup_parent: rfmapperf_k6.slice
    cpus: ${RFMAP_PERF_K6_CPUS:-2}

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [monitoring]
    # The caller's user, so it can read the admin token perf.py wrote with mode 0600.
    user: ${RFMAP_PERF_USER:-12345:12345}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${RFMAP_PERF_WORK_DIR:?perf.py passes its work folder}:/run/rfmap-perf:ro
    tmpfs:
      - /prometheus:mode=1777
    ports:
      - "127.0.0.1:${RFMAP_PERF_PROMETHEUS_PORT:-19090}:9090"
    cpus: 1
    mem_limit: 1g

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1@sha256:bc8acf1ad463294f25f3ad34262bc524cb9ec8401d1442953045d59fb8e9119a
    profiles: [monitoring]
    # Reads every container's cgroup: CPU, memory, I/O and network of the stand's containers.
    privileged: true
    command:
      - --docker_only=true
      - --raw_cgroup_prefix_whitelist=/rfmapperf_
      - --housekeeping_interval=2s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    cpus: 0.5
    mem_limit: 512m

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    profiles: [monitoring]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgis:5432/rfmap?sslmode=disable
      DATA_SOURCE_USER: rfmap
      DATA_SOURCE_PASS: perf
    cpus: 0.25
    mem_limit: 128m

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    profiles: [grafana]
    depends_on: [prometheus]
    user: ${RFMAP_PERF_USER:-12345:12345}
    environment:
      # Local only (127.0.0.1) and gone with the stand: no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - ${RFMAP_PERF_WORK_DIR:?perf.py passes its work folder}:/var/lib/rfmap-perf:ro
    tmpfs:
      - /var/lib/grafana:mode=1777
    ports:
      - "127.0.0.1:${RFMAP_PERF_GRAFANA_PORT:-13000}:3000"
