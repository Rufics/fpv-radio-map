<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<script src="$plotly_url" integrity="$plotly_integrity" crossorigin="anonymous"></script>
<style>
  :root { --fg: #1d2330; --muted: #5d6677; --line: #d9dde5; --bg: #ffffff; --panel: #f6f7f9;
          --bad: #c62828; --good: #2e7d32; --none: #6b7280; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 32px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .muted { color: var(--muted); }
  .verdict { display: inline-block; padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 12px; }
  .regression { background: #fdecea; color: var(--bad); }
  .improvement { background: #e8f5e9; color: var(--good); }
  .ok { background: #eef1f5; color: var(--fg); }
  .no-baseline { background: #f3f4f6; color: var(--none); }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 24px; margin: 8px 0; }
  .facts div { overflow-wrap: anywhere; } .facts b { color: var(--muted); font-weight: 500; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.ungated td { color: var(--muted); }
  .chart { width: 100%; height: 320px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 8px 16px; }
  details { background: var(--panel); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; margin: 0; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
$body
</main>
<script>
const figures = $figures;
for (const [id, figure] of Object.entries(figures)) {
  Plotly.newPlot(id, figure.data, figure.layout, { responsive: true, displaylogo: false });
}
</script>
</body>
</html>
