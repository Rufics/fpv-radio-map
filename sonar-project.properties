# SonarQube Cloud analysis, run by .github/workflows/sonar.yml (CI-based analysis: automatic
# analysis must be off in the project settings, see docs/dev/sonarcloud.md).
sonar.organization=rufics
sonar.projectKey=Rufics_fpv-radio-map
sonar.projectName=fpv-radio-map
sonar.sourceEncoding=UTF-8

# Sources and tests both start at the root; the test patterns below decide which files are tests.
# A file is either one or the other, so every test pattern is also excluded from the sources.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/*.spec.ts

# Not analysed at all: dependencies, build output, reports, generated code, binary files (images,
# the fuzz corpus), and the fuzz targets (built only with RFMAP_BUILD_FUZZERS, so they are not in
# the compile database).
sonar.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/*.spec.ts,\
  **/node_modules/**,\
  build/**,\
  build-*/**,\
  sonar-reports/**,\
  web/dist/**,\
  web/.angular/**,\
  web/coverage/**,\
  web/screenshots/**,\
  **/*.generated.ts,\
  **/*.png,\
  **/*.ico,\
  fuzz/corpus/**,\
  fuzz/**/*.cpp,\
  fuzz/**/*.hpp
sonar.test.exclusions=\
  **/node_modules/**,\
  build/**,\
  build-*/**

# Not counted for coverage, matching the CI coverage report: the example module, the fuzz harness,
# the sandboxed module worker (it leaves through _exit() and never writes its counters), and the
# operator tools that run in their own images (tiles-builder, wiki publishing).
sonar.coverage.exclusions=\
  examples/**,\
  fuzz/**,\
  platform/rfmod/tools/rfmod-worker.cpp,\
  tools/tiles-builder/**,\
  tools/wiki/**,\
  web/scripts/**,\
  deploy/**

# Data files and schemas repeat their structure by design.
sonar.cpd.exclusions=\
  data/**,\
  schemas/**

# C++: the compile database of the instrumented build in sonar.yml.
sonar.cfamily.compile-commands=build-sonar/compile_commands.json
sonar.coverageReportPaths=sonar-reports/cpp-coverage.xml

# SQL: the schema in server/sql is PostgreSQL (with PostGIS), not Oracle PL/SQL. By default .sql
# goes to the PL/SQL analyzer, which then warns that no Oracle Data Dictionary is configured; give
# .sql to the PostgreSQL analyzer instead and keep only the Oracle package suffixes for PL/SQL.
sonar.postgres.file.suffixes=sql,pgsql,psql
sonar.plsql.file.suffixes=pks,pkb

# Python: the version CI and the tiles-builder image use (Ubuntu 24.04).
sonar.python.version=3.12
sonar.python.coverage.reportPaths=sonar-reports/python-coverage.xml

# TypeScript: both Angular projects, merged by tools/ci/sonar_lcov.py.
sonar.javascript.lcov.reportPaths=sonar-reports/web.lcov
