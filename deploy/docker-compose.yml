# FPV Radio Map: PostGIS, a self-hosted Open-Meteo, rfmap-server and the web container.
# See docs/admin/deploy.md. Run from this directory:
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# Base images are pinned by digest (multi-arch index), read from the registries on 2026-10-17
# (postgis/postgis on 2026-10-22).

name: rfmap

services:
  postgis:
    image: postgis/postgis:18-3.6@sha256:b4466ea2ba7e3af54fcbba996d45325720f4b3ecb4f43f99b2f41367dc196f23
    environment:
      POSTGRES_DB: rfmap
      POSTGRES_USER: rfmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 keeps its data in a versioned folder below this mount
      # (/var/lib/postgresql/18/docker). The PostgreSQL 16 volume was pgdata: move it
      # with deploy/pg_upgrade.py (docs/admin/deploy.md, "PostgreSQL major upgrades").
      - pgdata18:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfmap -d rfmap"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Open-Meteo API, answering from the data the sync service keeps fresh. It starts only after
  # open-meteo-init has downloaded a first copy: the API keeps a model grid it failed to open
  # (because the files were not there yet) failed until it restarts.
  open-meteo:
    image: ghcr.io/open-meteo/open-meteo:1.7.0@sha256:64039ca2e6a18e6917cdc0cb1bf8cff5f2fbd8d67b7ca29b5364fab486e1f154
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    depends_on:
      open-meteo-init:
        condition: service_completed_successfully
        # Restart the API whenever open-meteo-init runs again, e.g. after OPEN_METEO_SYNC_MODELS changes.
        restart: true
    volumes:
      - open-meteo-data:/app/data
    networks: [backend]
    restart: unless-stopped

  # One sync pass before the API starts; it exits when done. With data already in the volume
  # it only fetches what changed. The variables are the ones Open-Meteo stores; the API derives
  # surface_pressure (from pressure_msl, temperature_2m and the model elevation) and the 10 m
  # wind speed and direction (from the u/v components) when rfmap-server asks for them.
  # dwd_icon_global_eps_native is synced for its static grid only: the API opens that grid for
  # every dwd_icon request and answers "Something went wrong." while it is missing.
  # See docs/admin/deploy.md, section 4.
  open-meteo-init:
    image: ghcr.io/open-meteo/open-meteo:1.7.0@sha256:64039ca2e6a18e6917cdc0cb1bf8cff5f2fbd8d67b7ca29b5364fab486e1f154
    command:
      - sync
      - &sync-models ${OPEN_METEO_SYNC_MODELS:-dwd_icon,dwd_icon_global_eps_native}
      - &sync-variables ${OPEN_METEO_VARIABLES:-temperature_2m,relative_humidity_2m,pressure_msl,precipitation,wind_u_component_10m,wind_v_component_10m,temperature_1000hPa,relative_humidity_1000hPa,geopotential_height_1000hPa,temperature_950hPa,relative_humidity_950hPa,geopotential_height_950hPa,temperature_925hPa,relative_humidity_925hPa,geopotential_height_925hPa,temperature_900hPa,relative_humidity_900hPa,geopotential_height_900hPa,temperature_850hPa,relative_humidity_850hPa,geopotential_height_850hPa}
      - --past-days
      - "1"
    volumes:
      - open-meteo-data:/app/data
    networks: [backend, egress]
    restart: on-failure:3

  # Keeps the data fresh after the first pass: checks for new model runs every 5 minutes.
  open-meteo-sync:
    image: ghcr.io/open-meteo/open-meteo:1.7.0@sha256:64039ca2e6a18e6917cdc0cb1bf8cff5f2fbd8d67b7ca29b5364fab486e1f154
    command:
      - sync
      - *sync-models
      - *sync-variables
      - --past-days
      - "1"
      - --repeat-interval
      - "5"
    depends_on:
      open-meteo-init:
        condition: service_completed_successfully
    volumes:
      - open-meteo-data:/app/data
    networks: [backend, egress]
    restart: unless-stopped

  rfmap-server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      args:
        # Your owner public key (rfmod keygen). Empty = public development key, with a warning.
        RFMAP_OWNER_PUBKEY: ${RFMAP_OWNER_PUBKEY:-}
    image: rfmap-server:local
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      RFMAP_DATABASE_URL: postgresql://rfmap:${POSTGRES_PASSWORD}@postgis:5432/rfmap
      RFMAP_ADMIN_TOKEN: ${RFMAP_ADMIN_TOKEN:?set RFMAP_ADMIN_TOKEN in .env}
      RFMAP_OPEN_METEO_URL: http://open-meteo:8080
      RFMAP__WEATHER__TIERS: '[{"name": "hourly", "models": "${OPEN_METEO_MODELS:-dwd_icon}"}]'
      RFMAP__DATA__DEMSTATEDERRORM: ${RFMAP_DEM_STATED_ERROR_M:-null}
      RFMAP__DATA__DEMSTATEDERRORSOURCE: ${RFMAP_DEM_STATED_ERROR_SOURCE:-}
    volumes:
      - ../server/config/server.example.json:/etc/rfmap/rfmap.json:ro
      - ${RFMAP_TILES_DIR:?set RFMAP_TILES_DIR in .env}:/data:ro
      - rfmap-state:/var/lib/rfmap
    networks: [backend, frontend]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: rfmap-web:local
    depends_on: [rfmap-server]
    ports:
      - "${RFMAP_HTTP_PORT:-8088}:8080"
    volumes:
      - ${RFMAP_TILES_DIR}:/tiles:ro
    networks: [frontend, public]
    restart: unless-stopped

networks:
  # No route out for PostGIS, the Open-Meteo API and rfmap-server (and with it every module
  # worker): both of its networks are internal. Only web publishes a port.
  backend:
    internal: true
  frontend:
    internal: true
  public: {}
  # Only the sync service downloads from the model providers.
  egress: {}

volumes:
  pgdata18:
  open-meteo-data:
  rfmap-state:
