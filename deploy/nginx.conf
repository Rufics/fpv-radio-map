# Same origin for the client, the API and the tiles: no CORS needed.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Flight logs are uploaded up to server.maxUploadBytes (64 MiB by default); modules are installed on the machine, never uploaded.
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://rfmap-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # rfmap-server (trustProxy: true) takes the last hop, which is the address nginx saw.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Share-link tokens are in the path; keep them out of the access log.
        access_log off;
    }

    # PMTiles are read with HTTP Range requests; nginx serves ranges of static files natively.
    location /tiles/ {
        alias /tiles/;
        autoindex off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/octet-stream pmtiles;
            application/x-protobuf   pbf;
            application/json         json;
        }
        # The COGs the server calculates with are not for the browser.
        location ~ \.tif$ { return 404; }
    }

    # MapLibre's worker is an ES module: browsers run it only with a JavaScript type (nosniff).
    location /maplibre/ {
        types { text/javascript mjs; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # The web app manifest: served with its own type and revalidated, like index.html that links it.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Client-side routes (/mission/..., /m/v/<token>) fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
