# The client address rfmap-server counts its rate limits by (it takes the last X-Forwarded-For
# entry). Port 8080 is for browsers: nginx appends the address it saw, so a client cannot pick its
# own. Port 8081 is for the TLS proxy in front (the caddy service): compose never publishes it, so
# whatever reaches it is that proxy, and the address the proxy put last is the client's.
map $server_port $rfmap_forwarded_for {
    8081    $http_x_forwarded_for;
    default $proxy_add_x_forwarded_for;
}

# Same origin for the client, the API and the tiles: no CORS needed.
server {
    listen 8080;
    listen 8081;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Module packages (POST /api/v1/admin/modules) are up to 64 MB.
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://rfmap-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # rfmap-server (trustProxy: true) takes the last hop: see $rfmap_forwarded_for above.
        proxy_set_header X-Forwarded-For $rfmap_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Share-link tokens are in the path; keep them out of the access log.
        access_log off;
    }

    # PMTiles are read with HTTP Range requests; nginx serves ranges of static files natively.
    location /tiles/ {
        alias /tiles/;
        autoindex off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/octet-stream pmtiles;
            application/x-protobuf   pbf;
            application/json         json;
        }
        # The COGs the server calculates with are not for the browser.
        location ~ \.tif$ { return 404; }
    }

    # MapLibre's worker is an ES module: browsers run it only with a JavaScript type (nosniff).
    location /maplibre/ {
        types { text/javascript mjs; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Client-side routes (/mission/..., /m/v/<token>) fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
